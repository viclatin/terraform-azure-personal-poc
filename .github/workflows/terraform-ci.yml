# Fast feedback on pull requests. The real plan runs in HCP Terraform, which is
# wired to this repository as a VCS-driven workspace -- this workflow only
# catches formatting and syntax problems before HCP is involved.
#
# Requires a repository secret named TF_API_TOKEN holding an HCP Terraform API
# token. `terraform init` needs it because the root module uses a cloud block.

name: terraform-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: fmt and validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialize
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color
